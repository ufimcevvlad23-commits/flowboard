[project]
name = "seo-article-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.scripts]
app = "app.main:app"

[tool.vercel]
entrypoint = "app.main:app"
